name: Actualizar datos (FCF e Instagram)

on:
  schedule:
    # Cada día a las 08:00 hora de Madrid (Instagram) y, además, domingos 23:00 y lunes 06:00 (FCF). Cron va en UTC.
    - cron: "0 6 * * *"
    - cron: "0 21 * * 0"
    - cron: "0 4 * * 1"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar clasificación y partidos de la FCF
        run: node herramientas/actualizar-fcf.mjs
        env:
          CHROME_PATH: google-chrome

      - name: Leer las últimas publicaciones de Instagram
        run: node herramientas/actualizar-instagram.mjs
        env:
          CHROME_PATH: google-chrome

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "Fénix FS bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos actualizados automáticamente (FCF / Instagram)"
            git push
          fi

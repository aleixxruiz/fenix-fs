name: Actualizar datos (FCF e Instagram)

on:
  schedule:
    # Dos veces al día (~08:20 y ~19:20 hora de Madrid) y, además, domingos ~23:20 y lunes ~06:20 (FCF).
    # Cron va en UTC. Minutos no redondos: GitHub retrasa o salta las tareas programadas a las horas en punto.
    - cron: "20 6 * * *"
    - cron: "20 17 * * *"
    - cron: "20 21 * * 0"
    - cron: "20 4 * * 1"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar clasificación y partidos de la FCF
        run: node herramientas/actualizar-fcf.mjs
        env:
          CHROME_PATH: google-chrome

      - name: Leer las últimas publicaciones de Instagram
        run: node herramientas/actualizar-instagram.mjs
        env:
          CHROME_PATH: google-chrome

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "Fénix FS bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos actualizados automáticamente (FCF / Instagram)"
            git push
          fi
